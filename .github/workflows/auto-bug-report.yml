name: Auto Bug Report (Failure Analyst)
on:
  workflow_run:
    workflows: ['Playwright Tests']
    types: [completed]
    branches: [main, master]

jobs:
  generate-bug-report:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci

      - name: Download test results artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download test-results (trace data)
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Re-run failed tests with JSON reporter
        id: rerun-failed
        continue-on-error: true
        run: |
          npx playwright test --last-failed --reporter=json 2>&1 > test-results.json || true

      - name: Run Failure Analyst
        env:
          JIRA_HOST: ${{ secrets.JIRA_HOST }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: |
          if [ -f test-results.json ]; then
            node ai-agents/agent-bug-report.js --file=test-results.json
          else
            node ai-agents/agent-bug-report.js --dry-run
          fi

      - name: Upload bug report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bug-report-output
          path: bug-report-output.json
          retention-days: 14
